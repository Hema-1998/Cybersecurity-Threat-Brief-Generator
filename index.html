<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Cybersecurity Threat Brief Generator</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600&display=swap');

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url("https://www.google.com/imgres?q=cybersecurity%20images%20for%20background%20to%20match%20the%20red%20yellow%20font&imgurl=https%3A%2F%2Ft3.ftcdn.net%2Fjpg%2F11%2F35%2F60%2F76%2F360_F_1135607690_942w1iBh0pIl4pcVPshae99sw65skoin.jpg&imgrefurl=https%3A%2F%2Fstock.adobe.com%2Fsearch%3Fk%3Dcybersecurity%2Bbackground&docid=epJjpzVQPosT7M&tbnid=Vgavy_f2DL8DhM&vet=12ahUKEwjv_eDI7fePAxXwpIkEHVHcKaQQM3oECGYQAA..i&w=720&h=360&hcb=2&ved=2ahUKEwjv_eDI7fePAxXwpIkEHVHcKaQQM3oECGYQAA") no-repeat center center/cover;
      font-family: "Roboto Mono", monospace;
      color: #e6edf3;
    }
    

    .container {
      background: rgba(13, 17, 23, 0.92);
      border-radius: 16px;
      padding: 30px;
      width: 90%;
      max-width: 950px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    }

    h1 {
      color: #f85149;
      text-align: center;
      margin-bottom: 20px;
      text-shadow: 0 0 6px rgba(248, 81, 73, 0.6);
    }

    textarea {
      width: 100%;
      height: 200px;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #30363d;
      background: #161b22;
      color: #e6edf3;
      font-size: 15px;
      resize: vertical;
    }

    button {
      padding: 12px 20px;
      margin-top: 14px;
      width: 100%;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #f85149, #d29922);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(248, 81, 73, 0.4);
    }

    .card {
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 18px;
      margin-top: 18px;
      background: #161b22;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    h2 {
      margin: 0 0 12px;
      font-size: 1.3em;
      color: #d29922;
    }

    #sum { color: #58a6ff; }
    #imp { color: #f85149; }
    #mit { color: #3fb950; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛡 Cybersecurity Threat Brief Generator</h1>
    <p>Paste a CVE/NVD/vendor advisory below:</p>
    <textarea id="input" placeholder="Paste advisory text..."></textarea>
    <br/>
    <button id="go">Generate Brief</button>

    <div id="out" style="display:none;">
      <div class="card"><h2>Summary</h2><div id="sum"></div></div>
      <div class="card"><h2>Impact</h2><div id="imp"></div></div>
      <div class="card"><h2>Mitigation</h2><div id="mit"></div></div>
    </div>
  </div>

  <script>
    document.getElementById("go").onclick = async () => {
      const text = document.getElementById("input").value.trim();
      if (!text) return alert("⚠️ Please paste some advisory text.");
      const res = await fetch("/brief", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({text})
      });
      if (!res.ok) {
        const j = await res.json().catch(()=>({error:"Unknown error"}));
        return alert(j.error || "Error");
      }
      const j = await res.json();
      document.getElementById("sum").textContent = j.summary || "";
      document.getElementById("imp").textContent = j.impact || "—";
      document.getElementById("mit").textContent = j.mitigation || "—";
      document.getElementById("out").style.display = "block";
    };
  </script>
</body>
</html>
